openapi: 3.1.0
info:
  title: Keepa GPT Bridge
  description: Retrieves Amazon Japan product and Keepa history data for sourcing analysis.
  version: 1.0.0
servers:
  - url: https://YOUR-RENDER-APP.onrender.com
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check whether the Keepa bridge is online
      responses:
        "200":
          description: Bridge health response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
  /keepa/product:
    get:
      operationId: getKeepaProduct
      summary: Get Keepa product data for an Amazon Japan ASIN
      description: Use this whenever an ASIN can be read from the user's screenshot, Keepa URL, or message.
      parameters:
        - name: asin
          in: query
          required: true
          description: Amazon ASIN or text/URL containing the ASIN.
          schema:
            type: string
        - name: stats_days
          in: query
          required: false
          schema:
            type: integer
            default: 180
            minimum: 1
            maximum: 3650
        - name: offers
          in: query
          required: false
          schema:
            type: integer
            default: 20
            minimum: 0
            maximum: 100
      responses:
        "200":
          description: Keepa product information and history
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400":
          description: Invalid ASIN
        "401":
          description: Unauthorized
        "502":
          description: Keepa API error
