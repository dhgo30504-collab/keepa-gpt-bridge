openapi: 3.1.0

info:
  title: Keepa GPT Bridge
  description: Retrieves Amazon Japan product, offer, and variation data for sourcing analysis.
  version: 1.2.0

servers:
  - url: https://keepa-gpt-bridge.onrender.com

paths:

  /health:
    get:
      operationId: healthCheck
      summary: Check whether the Keepa bridge is online
      responses:
        "200":
          description: Bridge health response
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  version:
                    type: string
                  keepaConfigured:
                    type: boolean

  /keepa/product:
    get:
      operationId: getKeepaProduct
      summary: Get core Keepa product data for an Amazon Japan ASIN
      description: >
        Use this first when an ASIN is available.
        Returns core product information, monthly sales,
        Buy Box information, offer counts, price snapshots,
        and sales rank information.
      parameters:
        - name: asin
          in: query
          required: true
          description: Amazon ASIN or text/URL containing the ASIN.
          schema:
            type: string

        - name: stats_days
          in: query
          required: false
          description: Number of days for Keepa statistics.
          schema:
            type: integer
            default: 180
            minimum: 1
            maximum: 365

      responses:
        "200":
          description: Core Keepa product information
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: boolean

                  product:
                    type: object
                    properties:
                      asin:
                        type: string
                      title:
                        type: string
                      brand:
                        type: string
                      manufacturer:
                        type: string
                      productGroup:
                        type: string
                      monthlySold:
                        type: integer
                      rating:
                        type: number
                      reviewCount:
                        type: integer
                      availabilityAmazon:
                        type: integer
                      parentAsin:
                        type: string
                      variationCSV:
                        type: array
                        items: {}

                  buyBox:
                    type: object
                    properties:
                      price:
                        type: integer
                      shipping:
                        type: integer
                      isAmazon:
                        type: boolean
                      isFBA:
                        type: boolean

                  offersSummary:
                    type: object
                    properties:
                      fbaCount:
                        type: integer
                      fbmCount:
                        type: integer

                  priceAndRankSnapshots:
                    type: object
                    properties:
                      current:
                        type: array
                        items: {}
                      avg30:
                        type: array
                        items: {}
                      avg90:
                        type: array
                        items: {}
                      avg180:
                        type: array
                        items: {}

                  rank:
                    type: object
                    properties:
                      salesRankReference:
                        type: integer
                      currentSalesRank:
                        type: integer
                      avg30SalesRank:
                        type: integer
                      avg90SalesRank:
                        type: integer
                      avg180SalesRank:
                        type: integer

                  keepaMeta:
                    type: object
                    properties:
                      tokensLeft:
                        type: integer
                      refillIn:
                        type: integer
                      refillRate:
                        type: integer
                      timestamp:
                        type: integer

        "400":
          description: Invalid ASIN
        "401":
          description: Unauthorized
        "502":
          description: Keepa API error


  /keepa/offers:
    get:
      operationId: getKeepaOffers
      summary: Get offer and seller information for an Amazon Japan ASIN
      description: >
        Use this when seller competition, FBA/FBM counts,
        Buy Box status, Amazon presence, or individual offers
        are important for the sourcing decision.
      parameters:
        - name: asin
          in: query
          required: true
          description: Amazon ASIN.
          schema:
            type: string

        - name: offer_count
          in: query
          required: false
          description: Maximum number of offers to inspect.
          schema:
            type: integer
            default: 20
            minimum: 1
            maximum: 50

      responses:
        "200":
          description: Keepa offer information
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: boolean
                  asin:
                    type: string

                  summary:
                    type: object
                    properties:
                      buyBoxPrice:
                        type: integer
                      buyBoxShipping:
                        type: integer
                      buyBoxIsAmazon:
                        type: boolean
                      buyBoxIsFBA:
                        type: boolean
                      fbaCount:
                        type: integer
                      fbmCount:
                        type: integer
                      totalReturnedOffers:
                        type: integer

                  offers:
                    type: array
                    items:
                      type: object
                      properties:
                        sellerId:
                          type: string
                        isFBA:
                          type: boolean
                        isAmazon:
                          type: boolean
                        isBuyBoxWinner:
                          type: boolean
                        isPrime:
                          type: boolean
                        condition:
                          type: integer
                        conditionComment:
                          type: string
                        lastSeen:
                          type: integer
                        offerCSVLastValues:
                          type: array
                          items: {}

                  keepaMeta:
                    type: object
                    properties:
                      tokensLeft:
                        type: integer
                      refillIn:
                        type: integer
                      refillRate:
                        type: integer

        "400":
          description: Invalid ASIN
        "401":
          description: Unauthorized
        "502":
          description: Keepa API error


  /keepa/variations:
    get:
      operationId: getKeepaVariations
      summary: Get variation information for an Amazon Japan ASIN
      description: >
        Use this when the product has variations.
        Returns child ASINs with monthly sales, price,
        ranking, Amazon presence, and offer counts
        so the strongest variation can be identified.
      parameters:
        - name: asin
          in: query
          required: true
          description: Parent or child Amazon ASIN.
          schema:
            type: string

      responses:
        "200":
          description: Keepa variation information
          content:
            application/json:
              schema:
                type: object
                properties:
                  found:
                    type: boolean
                  requestedAsin:
                    type: string
                  parentAsin:
                    type: string
                  variationCount:
                    type: integer

                  variations:
                    type: array
                    items:
                      type: object
                      properties:
                        asin:
                          type: string
                        title:
                          type: string
                        brand:
                          type: string
                        monthlySold:
                          type: integer
                        rating:
                          type: number
                        reviewCount:
                          type: integer
                        availabilityAmazon:
                          type: integer
                        currentSalesRank:
                          type: integer
                        buyBoxPrice:
                          type: integer
                        buyBoxIsAmazon:
                          type: boolean
                        buyBoxIsFBA:
                          type: boolean
                        fbaCount:
                          type: integer
                        fbmCount:
                          type: integer

                  message:
                    type: string

                  keepaMeta:
                    type: object
                    properties:
                      tokensLeft:
                        type: integer
                      refillIn:
                        type: integer
                      refillRate:
                        type: integer

        "400":
          description: Invalid ASIN
        "401":
          description: Unauthorized
        "502":
          description: Keepa API error


  /rules:
    get:
      operationId: getJudgmentRules
      summary: Get shared Amazon sourcing judgment rules
      description: Retrieves the latest shared sourcing judgment rules used by all instructors.
      parameters:
        - name: X-Action-Key
          in: header
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Shared judgment rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: string
                  rules:
                    type: string
        "401":
          description: Unauthorized
        "500":
          description: Judgment rules error
