services:
  - type: web
    name: keepa-gpt-bridge
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: KEEPA_API_KEY
        sync: false
      - key: ACTION_API_KEY
        sync: false
